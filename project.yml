name: Mimesis
options:
  bundleIdPrefix: com.ljworkshop
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 49Y2NVWNTQ
    # Crimson #DD1B3F, the colour Arete and Imago use (Assets.xcassets/AccentColor in Mac/ and iOS/).
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  MimesisKit:
    path: Packages/MimesisKit
  # Photo and video viewing and editing, shared with Arete and Imago at a version. Pinned here, since
  # Mimesis.xcodeproj (and its Package.resolved) isn't kept in git: raise it to take an update.
  # To change the package itself, see the README in github.com/jiapoo/apple-media.
  AreteMedia:
    url: https://github.com/jiapoo/apple-media
    exactVersion: 1.13.0
targets:
  MimesisMac:
    type: application
    scheme: {}
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: MimesisKit
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Mimesis
        LSApplicationCategoryType: public.app-category.sports
        NSCameraUsageDescription: Live replay shows the camera a few seconds late, so you can watch what you just did.
        # Mimesis opens videos from other apps: Share › Mimesis on iPhone and iPad, Open With and the Dock icon on the Mac.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, com.apple.m4v-video]
          - CFBundleTypeName: Mimesis Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.ljworkshop.mimesis.project]
        # A project file: a package (a folder shown as one file) with the edits and the two videos.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ljworkshop.mimesis.project
            UTTypeDescription: Mimesis Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [mimesis]
    settings:
      base:
        # One bundle ID on every platform, so one purchase covers Mac, iPad and iPhone.
        PRODUCT_BUNDLE_IDENTIFIER: com.ljworkshop.mimesis
        PRODUCT_NAME: Mimesis
        ENABLE_HARDENED_RUNTIME: YES
        # The sandbox, files the user picks, and bookmarks (so saved comparisons find their clips again).
        CODE_SIGN_ENTITLEMENTS: Mac/MimesisMac.entitlements
      configs:
        # Debug builds may also read test clips from /private/tmp (for `-Left <path> -Right <path>`).
        # Release keeps MimesisMac.entitlements: the sandbox with only files the user picks.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Mac/MimesisMacDebug.entitlements
  MimesisiOS:
    type: application
    scheme: {}
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: MimesisKit
      # Share › Mimesis in every app's Share sheet.
      - target: MimesisShare
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Mimesis
        UILaunchScreen: {}
        # Landscape too on iPhone: that's where two clips fit side by side.
        # iPhone: sideways only, the two clips side by side. iPad: any way up.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        NSCameraUsageDescription: Live replay shows the camera a few seconds late, so you can watch what you just did.
        # Mimesis opens videos from other apps: Share › Mimesis on iPhone and iPad, Open With and the Dock icon on the Mac.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, com.apple.m4v-video]
          - CFBundleTypeName: Mimesis Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.ljworkshop.mimesis.project]
        # A project file: a package (a folder shown as one file) with the edits and the two videos.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ljworkshop.mimesis.project
            UTTypeDescription: Mimesis Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [mimesis]
        LSSupportsOpeningDocumentsInPlace: true
        # mimesis://inbox: Share › Mimesis opens the app with the videos it just put in the shared folder.
        CFBundleURLTypes:
          - CFBundleURLName: com.ljworkshop.mimesis
            CFBundleURLSchemes: [mimesis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ljworkshop.mimesis
        PRODUCT_NAME: Mimesis
        # The App Group shared with Share › Mimesis.
        CODE_SIGN_ENTITLEMENTS: iOS/MimesisApp.entitlements
        # iCloud sync of the library's notes and tags needs the iCloud key-value capability, which needs the
        # Apple Developer Program License Agreement accepted first. Then uncomment this, add the same
        # com.apple.developer.ubiquity-kvstore-identifier key to Mac/MimesisMac*.entitlements, and build.
        # (then merge iOS/Mimesis.entitlements into iOS/MimesisApp.entitlements)
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"

  # Share › Mimesis: in any app's Share sheet on iPhone and iPad (Arete, Imago, Photos, Files, Messages).
  # It copies the one or two videos into the App Group's Inbox and opens Mimesis, which takes them as A and B.
  MimesisShare:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Mimesis
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsMovieWithMaxCount: 2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ljworkshop.mimesis.share
        PRODUCT_NAME: MimesisShare
        CODE_SIGN_ENTITLEMENTS: ShareExtension/MimesisShare.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
