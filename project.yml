name: Mimesis
options:
  bundleIdPrefix: com.arc
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 49Y2NVWNTQ
    # Crimson #DD1B3F, the colour Arete and Imago use (Assets.xcassets/AccentColor in Mac/ and iOS/).
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  MimesisKit:
    path: Packages/MimesisKit
  # Photo and video viewing and editing, shared with Arete and Imago at a version. Pinned here, since
  # Mimesis.xcodeproj (and its Package.resolved) isn't kept in git: raise it to take an update.
  # To change the package itself, see the README in github.com/jiapoo/apple-media.
  AreteMedia:
    url: https://github.com/jiapoo/apple-media
    exactVersion: 1.8.0
targets:
  MimesisMac:
    type: application
    scheme: {}
    platform: macOS
    sources: [Mac]
    dependencies:
      - package: MimesisKit
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Mimesis
        LSApplicationCategoryType: public.app-category.sports
        NSCameraUsageDescription: Court mode shows the camera a few seconds late, so you can watch the stroke you just hit.
        # Mimesis opens videos from other apps: Share › Mimesis on iPhone and iPad, Open With and the Dock icon on the Mac.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, com.apple.m4v-video]
    settings:
      base:
        # One bundle ID on every platform, so one purchase covers Mac, iPad and iPhone.
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.mimesis
        PRODUCT_NAME: Mimesis
        ENABLE_HARDENED_RUNTIME: YES
        # The sandbox, files the user picks, and bookmarks (so saved comparisons find their clips again).
        CODE_SIGN_ENTITLEMENTS: Mac/MimesisMac.entitlements
      configs:
        # Debug builds may also read test clips from /private/tmp (for `-Left <path> -Right <path>`).
        # Release keeps MimesisMac.entitlements: the sandbox with only files the user picks.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Mac/MimesisMacDebug.entitlements
  MimesisiOS:
    type: application
    scheme: {}
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: MimesisKit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Mimesis
        UILaunchScreen: {}
        # Landscape too on iPhone: that's where two clips fit side by side.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        NSCameraUsageDescription: Court mode shows the camera a few seconds late, so you can watch the stroke you just hit.
        # Mimesis opens videos from other apps: Share › Mimesis on iPhone and iPad, Open With and the Dock icon on the Mac.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.mpeg-4, com.apple.quicktime-movie, com.apple.m4v-video]
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arc.mimesis
        PRODUCT_NAME: Mimesis
        # iCloud sync of the library's notes and tags needs the iCloud key-value capability, which needs the
        # Apple Developer Program License Agreement accepted first. Then uncomment this, add the same
        # com.apple.developer.ubiquity-kvstore-identifier key to Mac/MimesisMac*.entitlements, and build.
        # CODE_SIGN_ENTITLEMENTS: iOS/Mimesis.entitlements
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
